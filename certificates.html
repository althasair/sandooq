:root{--brown:#3A2418;--leather:#7A4A2B;--orange:#E2600F;--gold:#B8914F;--muted:#8B7563;--m:'Marhey',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e2d6;font-family:var(--m);color:var(--brown)}
.bar{position:sticky;top:0;z-index:10;background:#2c1a10;color:#f6efe4;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 28px}
.bar b{font-size:18px}
.bar span{font-size:13px;color:#d9c2a3}
.bar button{font-family:var(--m);font-size:15px;border:none;border-radius:30px;padding:9px 24px;background:#E8681A;color:#fff;cursor:pointer}
.wrap{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 0 60px}
.cert{width:297mm;height:210mm;background:linear-gradient(180deg,#fff 0%,#fff 80%,#FFF1E4 100%);position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15)}
/* إطار أنيق قليل الحبر */
.cert .f1{position:absolute;inset:9mm;border:2px solid var(--orange);border-radius:3mm}
.cert .f2{position:absolute;inset:11.5mm;border:.8px solid rgba(226,96,15,.45);border-radius:2mm}
.cert .corner{position:absolute;width:24mm;height:24mm;border-color:var(--orange);border-style:solid;border-width:0}
.cert .c1{top:7mm;right:7mm;border-top-width:4px;border-right-width:4px}
.cert .c2{top:7mm;left:7mm;border-top-width:4px;border-left-width:4px}
.cert .c3{bottom:7mm;right:7mm;border-bottom-width:4px;border-right-width:4px}
.cert .c4{bottom:7mm;left:7mm;border-bottom-width:4px;border-left-width:4px}
.cert .ribbon{position:absolute;top:0;right:26mm;width:17mm;height:40mm;background:linear-gradient(180deg,#F08A3E,#C2560F);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.cert .in{position:absolute;inset:16mm 22mm 14mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{height:27mm;margin-top:-3mm}
.school{font-size:13pt;font-weight:500;color:var(--leather);letter-spacing:.3px}
.event{font-size:10.5pt;color:var(--muted);margin-top:1mm}
.title{font-size:42pt;font-weight:700;color:var(--orange);line-height:1.25;margin-top:3mm}
.lead{font-size:13pt;color:var(--leather);margin-top:2mm}
.name{font-size:34pt;font-weight:700;color:var(--orange);margin-top:3mm;white-space:nowrap;line-height:1.4;outline:none}
.role{font-size:12.5pt;color:var(--leather);margin-top:.5mm}
.text .hl{display:block;font-size:19pt;font-weight:700;color:var(--orange);margin-bottom:2mm}
.text{font-size:15pt;line-height:1.95;color:#4a3426;max-width:225mm;margin-top:8mm;text-align:justify;text-align-last:center}
.verse{font-family:'Amiri',serif;font-weight:700;font-size:20pt;color:#B4500F;margin-top:8mm}
.sigs{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6mm}
.sig{width:72mm;text-align:center;position:relative}
.sig .t{font-size:10.5pt;color:var(--muted)}
.sig .n{font-size:13pt;font-weight:600;color:var(--brown);position:relative;z-index:2}
.sig.mid{height:30mm;display:flex;flex-direction:column;justify-content:flex-end}
.sig.mid img{position:absolute;left:50%;bottom:-5mm;transform:translateX(-50%);height:26mm;max-width:70mm;opacity:.55;z-index:1;mix-blend-mode:multiply}
.sig .ln{width:44mm;height:1px;background:var(--orange);margin:0 auto 1.5mm}
.hint{font-family:var(--m);font-size:13px;color:#7a5a3a;text-align:center;max-width:900px;line-height:1.9}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  .bar,.hint{display:none}
  .wrap{padding:0;gap:0}
  .cert{box-shadow:none;page-break-after:always;break-after:page}
  .cert:last-child{page-break-after:auto}
  .name{outline:none}
}
